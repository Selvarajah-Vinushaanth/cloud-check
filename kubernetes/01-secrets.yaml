---
# Secrets - In production, use AWS Secrets Manager or Sealed Secrets (not plain K8s secrets)
# These are base64-encoded placeholders. Replace with actual values.
# Generate with: echo -n "value" | base64

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: cloud-summit
type: Opaque
data:
  # echo -n "your_db_password" | base64
  password: eW91cl9kYl9wYXNzd29yZA==   # "your_db_password"
  username: cG9zdGdyZXM=               # "postgres"

---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: cloud-summit
type: Opaque
data:
  # AWS credentials for Lambda invocation
  # echo -n "YOUR_ACCESS_KEY" | base64
  aws-access-key-id:     QUNDRVNTX0tFWV9QTEFDRUJE
  aws-secret-access-key: U0VDUkVUX0FDQ0VTU19LRVlfUExBQ0VIT0xERVI=

---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: cloud-summit
type: Opaque
data:
  # echo -n "clickhouse_password" | base64
  password: Y2xpY2tob3VzZV9wYXNzd29yZA==
