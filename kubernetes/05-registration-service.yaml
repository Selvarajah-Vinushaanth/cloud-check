---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service-blue
  namespace: cloud-summit
  labels:
    app: registration-service
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registration-service
      version: blue
  template:
    metadata:
      labels:
        app: registration-service
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3003"
    spec:
      containers:
        - name: registration-service
          image: 516962256649.dkr.ecr.ap-south-1.amazonaws.com/registration-service:blue
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: registrations_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: NODE_ENV
              value: production
            - name: EVENT_SERVICE_URL
              value: "http://event-service:3001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 30
            periodSeconds: 15

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service-green
  namespace: cloud-summit
  labels:
    app: registration-service
    version: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: registration-service
      version: green
  template:
    metadata:
      labels:
        app: registration-service
        version: green
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3003"
    spec:
      containers:
        - name: registration-service
          image: 516962256649.dkr.ecr.ap-south-1.amazonaws.com/registration-service:green
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: registrations_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: NODE_ENV
              value: production
            - name: EVENT_SERVICE_URL
              value: "http://event-service:3001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
  namespace: cloud-summit
spec:
  selector:
    app: registration-service
    version: blue
  ports:
    - port: 3003
      targetPort: 3003
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: registration-service-hpa
  namespace: cloud-summit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: registration-service-blue
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
