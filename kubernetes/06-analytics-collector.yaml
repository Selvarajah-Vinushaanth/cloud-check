---
# Analytics Collector - Blue/Green
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-collector-blue
  namespace: cloud-summit
  labels:
    app: analytics-collector
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-collector
      version: blue
  template:
    metadata:
      labels:
        app: analytics-collector
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3004"
    spec:
      containers:
        - name: analytics-collector
          image: 516962256649.dkr.ecr.ap-south-1.amazonaws.com/analytics-collector:blue
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: CLICKHOUSE_HOST
              value: "http://clickhouse:8123"
            - name: CLICKHOUSE_DATABASE
              value: analytics
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
            - name: NODE_ENV
              value: production
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 30
            periodSeconds: 15

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-collector-green
  namespace: cloud-summit
  labels:
    app: analytics-collector
    version: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: analytics-collector
      version: green
  template:
    metadata:
      labels:
        app: analytics-collector
        version: green
    spec:
      containers:
        - name: analytics-collector
          image: 516962256649.dkr.ecr.ap-south-1.amazonaws.com/analytics-collector:green
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: CLICKHOUSE_HOST
              value: "http://clickhouse:8123"
            - name: CLICKHOUSE_DATABASE
              value: analytics
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
            - name: NODE_ENV
              value: production
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-collector
  namespace: cloud-summit
spec:
  selector:
    app: analytics-collector
    version: blue
  ports:
    - port: 3004
      targetPort: 3004
  type: ClusterIP
